name: Build Flutter Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 1. إلغاء أي بناء قديم/معلق تلقائياً عند الدفع الجديد لمنع زحمة الطوابير — في الـPR بس.
# على main كل push بيستنى دوره: رن 1.0.8+9 [closed-testing] (fb22af25، ١٣/١١) اتلغى لما
# اندمج بعده PR تاني بدقايق، فالإصدار اللي فيه تصليح الإعلانات ماتبناش ولا اترفع.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The app's own gates before any APK is built (ZAD_DREAM_PLAN.md ش١): 1,636 tests
  # and the analyzer used to run only when a session remembered to run them locally.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pinned: an unpinned «latest stable» became 3.50.0 on 2026-11-11 and
          # its material.dart deprecation turned `flutter analyze` red (295
          # infos) on every PR. Bump it as a deliberate commit, with the
          # migration, like the Supabase CLI pin.
          flutter-version: '3.47.9'
          cache: true
      - name: Install dependencies
        run: flutter pub get
        working-directory: zad_flutter
      - name: Analyze
        run: flutter analyze
        working-directory: zad_flutter
      - name: Test
        run: flutter test
        working-directory: zad_flutter

  build:
    needs: verify
    # A pull request is verified only; APKs and the AAB are built from main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25 # 2. تحديد وقت أقصى للبناء حتى لا يتعطل السيرفر

    steps:
      # Run #647 (2026-11-01) died in "Build APK" with «No space left on device» while the
      # Android Gradle plugin unzipped the NDK — the same commit built fine on the PR run an
      # hour earlier. Runners differ in free space; this build needs the NDK, three APK
      # variants and an AAB. Toolchains it never touches go first (~20 GB); the Android SDK
      # under /usr/local/lib/android stays.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/CodeQL" /usr/local/share/powershell /usr/share/swift || true
          df -h / | tail -1

      - uses: actions/checkout@v4

      # 3. تثبيت جافا وتفعيل الكاش لـ Gradle لتسريع بناء الأندرويد
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 4. تفعيل كاش الفلاتر لعدم إعادة تنزيل الحزم في كل مرة
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pinned: an unpinned «latest stable» became 3.50.0 on 2026-11-11 and
          # its material.dart deprecation turned `flutter analyze` red (295
          # infos) on every PR. Bump it as a deliberate commit, with the
          # migration, like the Supabase CLI pin.
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: zad_flutter
      # One signing key for every build. Without it each runner makes a fresh
      # debug key, so every APK is signed differently and Android refuses to
      # install it over the last one ("التطبيق غير مثبت" / package conflicts) —
      # the phone keeps the old app. Measured 2026-10-13: runs #123 and #124
      # carried different certificates. The secret is the codespace's
      # ~/.android/debug.keystore, base64, so local builds match CI's too.
      - name: Use the shared debug key
        env:
          KEYSTORE_B64: ${{ secrets.ZAD_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning title=APK signing::ZAD_DEBUG_KEYSTORE_B64 is not set — this APK gets a one-off key and will not install over the previous one."
            echo "⚠️ APK signed with a one-off key: uninstall the old app before installing it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p "$HOME/.android"
          # A pasted secret can carry spaces, quotes or CRs; keep only base64 characters.
          # A secret that still does not decode to a keystore must not block the APK:
          # warn and fall back to the runner's one-off key (run #125 failed here).
          if printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$HOME/.android/debug.keystore" 2>/dev/null \
             && keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android | grep -i fingerprint; then
            exit 0
          fi
          rm -f "$HOME/.android/debug.keystore"
          echo "::warning title=APK signing::ZAD_DEBUG_KEYSTORE_B64 is not a valid base64 debug keystore — this APK gets a one-off key."
          echo "⚠️ ZAD_DEBUG_KEYSTORE_B64 is invalid; APK signed with a one-off key: uninstall the old app before installing it." >> "$GITHUB_STEP_SUMMARY"

      - name: Build APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=ADMOB_INTERSTITIAL_UNIT="${{ secrets.ADMOB_INTERSTITIAL_UNIT }}" \
            --dart-define=ADMOB_INLINE_UNIT="${{ secrets.ADMOB_INLINE_UNIT }}" \
            --dart-define=ADMOB_NATIVE_UNIT="${{ secrets.ADMOB_NATIVE_UNIT }}" \
            --dart-define=ADMOB_APP_OPEN_UNIT="${{ secrets.ADMOB_APP_OPEN_UNIT }}"
        working-directory: zad_flutter

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: zad_flutter/build/app/outputs/flutter-apk/app-debug.apk

      # The full release build — what goes on a phone
      - name: Build release APK
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=ADMOB_INTERSTITIAL_UNIT="${{ secrets.ADMOB_INTERSTITIAL_UNIT }}" \
            --dart-define=ADMOB_INLINE_UNIT="${{ secrets.ADMOB_INLINE_UNIT }}" \
            --dart-define=ADMOB_NATIVE_UNIT="${{ secrets.ADMOB_NATIVE_UNIT }}" \
            --dart-define=ADMOB_APP_OPEN_UNIT="${{ secrets.ADMOB_APP_OPEN_UNIT }}"
        working-directory: zad_flutter

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: zad_flutter/build/app/outputs/flutter-apk/app-*-release.apk

      # The Play Console bundle, signed with the upload key. Only this step sees
      # the key, so the APKs above keep the debug key the phone already has.
      - name: Build Play bundle (AAB)
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.ZAD_UPLOAD_KEYSTORE_B64 }}
          UPLOAD_PASSWORD: ${{ secrets.ZAD_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ] || [ -z "$UPLOAD_PASSWORD" ]; then
            echo "::warning title=Play bundle::ZAD_UPLOAD_KEYSTORE_B64 / ZAD_UPLOAD_KEY_PASSWORD not set — no AAB built."
            echo "⚠️ No Play bundle: set ZAD_UPLOAD_KEYSTORE_B64 and ZAD_UPLOAD_KEY_PASSWORD." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$UPLOAD_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/upload.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" KEY_ALIAS=releasekey \
                 STORE_PASSWORD="$UPLOAD_PASSWORD" KEY_PASSWORD="$UPLOAD_PASSWORD"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep -i fingerprint
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=ADMOB_INTERSTITIAL_UNIT="${{ secrets.ADMOB_INTERSTITIAL_UNIT }}" \
            --dart-define=ADMOB_INLINE_UNIT="${{ secrets.ADMOB_INLINE_UNIT }}" \
            --dart-define=ADMOB_NATIVE_UNIT="${{ secrets.ADMOB_NATIVE_UNIT }}" \
            --dart-define=ADMOB_APP_OPEN_UNIT="${{ secrets.ADMOB_APP_OPEN_UNIT }}"
          rm -f "$KEYSTORE_PATH"
        working-directory: zad_flutter

      - uses: actions/upload-artifact@v4
        if: hashFiles('zad_flutter/build/app/outputs/bundle/release/app-release.aab') != ''
        with:
          name: app-release-aab
          path: zad_flutter/build/app/outputs/bundle/release/app-release.aab

      # Google Play: the AAB goes to the internal testing track (owner 6/11 — the service account
      # google-play-auto-publisher was added in Play Console and its JSON key is PLAY_CONFIG_JSON).
      # Skipped, with a visible note, when either the key or the AAB is missing.
      - name: Check Play upload
        id: play
        env:
          PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG_JSON }}
        run: |
          if [ -z "$PLAY_CONFIG_JSON" ]; then
            echo "::warning title=Play upload::PLAY_CONFIG_JSON is not set — nothing sent to Google Play."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ ! -f zad_flutter/build/app/outputs/bundle/release/app-release.aab ]; then
            echo "::warning title=Play upload::no AAB (upload key missing) — nothing sent to Google Play."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # الرفع لبلاي مايوقّعش البيلد (٧/١١): الـAPK والـAAB اترفعوا artifacts فوق قبله، والرفع كان بيفشل بس على
      # صلاحيات جوجل (الـAPI مقفول، وبعده دعوة الـService Account لسه ماتفعّلتش) — فكل رن كان أحمر والتطبيق سليم.
      # الفشل فاضل ظاهر: تحذير فوق الرن وسطر في الملخص (الخطوة اللي بعدها).
      # A push whose commit message says [closed-testing] goes to the testers (the alpha track is
      # Play's closed testing); every other push stays on internal, so a merge never reaches them.
      - name: Upload to Google Play
        id: play_upload
        if: steps.play.outputs.ready == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: com.aistudio.zad.wrtqvx
          releaseFiles: zad_flutter/build/app/outputs/bundle/release/app-release.aab
          track: ${{ contains(github.event.head_commit.message, '[closed-testing]') && 'alpha' || 'internal' }}
          status: completed

      - name: Play upload result
        if: steps.play.outputs.ready == 'true' && steps.play_upload.outcome == 'failure'
        run: |
          echo "::warning title=Not uploaded to Google Play::The AAB built fine (see artifacts) but Play refused the upload - check the service account's permissions in Play Console."
          echo "### :warning: AAB not uploaded to Google Play - the build itself passed; see the upload step's error" >> "$GITHUB_STEP_SUMMARY"
