name: Build Flutter Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 1. إلغاء أي بناء قديم/معلق تلقائياً عند الدفع الجديد لمنع زحمة الطوابير
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # 2. تحديد وقت أقصى للبناء حتى لا يتعطل السيرفر

    steps:
      - uses: actions/checkout@v4

      # 3. تثبيت جافا وتفعيل الكاش لـ Gradle لتسريع بناء الأندرويد
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 4. تفعيل كاش الفلاتر لعدم إعادة تنزيل الحزم في كل مرة
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: zad_flutter
      # One signing key for every build. Without it each runner makes a fresh
      # debug key, so every APK is signed differently and Android refuses to
      # install it over the last one ("التطبيق غير مثبت" / package conflicts) —
      # the phone keeps the old app. Measured 2026-10-13: runs #123 and #124
      # carried different certificates. The secret is the codespace's
      # ~/.android/debug.keystore, base64, so local builds match CI's too.
      - name: Use the shared debug key
        env:
          KEYSTORE_B64: ${{ secrets.ZAD_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning title=APK signing::ZAD_DEBUG_KEYSTORE_B64 is not set — this APK gets a one-off key and will not install over the previous one."
            echo "⚠️ APK signed with a one-off key: uninstall the old app before installing it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android | grep -i fingerprint

      - name: Build APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
        working-directory: zad_flutter

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: zad_flutter/build/app/outputs/flutter-apk/app-debug.apk

      # The full release build — what goes on a phone
      - name: Build release APK
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
        working-directory: zad_flutter

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: zad_flutter/build/app/outputs/flutter-apk/app-*-release.apk
