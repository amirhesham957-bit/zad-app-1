name: Build Flutter Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 1. إلغاء أي بناء قديم/معلق تلقائياً عند الدفع الجديد لمنع زحمة الطوابير
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # 2. تحديد وقت أقصى للبناء حتى لا يتعطل السيرفر

    steps:
      - uses: actions/checkout@v4

      # 3. تثبيت جافا وتفعيل الكاش لـ Gradle لتسريع بناء الأندرويد
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 4. تفعيل كاش الفلاتر لعدم إعادة تنزيل الحزم في كل مرة
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: zad_flutter
      # One signing key for every build. Without it each runner makes a fresh
      # debug key, so every APK is signed differently and Android refuses to
      # install it over the last one ("التطبيق غير مثبت" / package conflicts) —
      # the phone keeps the old app. Measured 2026-10-13: runs #123 and #124
      # carried different certificates. The secret is the codespace's
      # ~/.android/debug.keystore, base64, so local builds match CI's too.
      - name: Use the shared debug key
        env:
          KEYSTORE_B64: ${{ secrets.ZAD_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning title=APK signing::ZAD_DEBUG_KEYSTORE_B64 is not set — this APK gets a one-off key and will not install over the previous one."
            echo "⚠️ APK signed with a one-off key: uninstall the old app before installing it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p "$HOME/.android"
          # A pasted secret can carry spaces, quotes or CRs; keep only base64 characters.
          # A secret that still does not decode to a keystore must not block the APK:
          # warn and fall back to the runner's one-off key (run #125 failed here).
          if printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$HOME/.android/debug.keystore" 2>/dev/null \
             && keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android | grep -i fingerprint; then
            exit 0
          fi
          rm -f "$HOME/.android/debug.keystore"
          echo "::warning title=APK signing::ZAD_DEBUG_KEYSTORE_B64 is not a valid base64 debug keystore — this APK gets a one-off key."
          echo "⚠️ ZAD_DEBUG_KEYSTORE_B64 is invalid; APK signed with a one-off key: uninstall the old app before installing it." >> "$GITHUB_STEP_SUMMARY"

      - name: Build APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
        working-directory: zad_flutter

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: zad_flutter/build/app/outputs/flutter-apk/app-debug.apk

      # The full release build — what goes on a phone
      - name: Build release APK
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
        working-directory: zad_flutter

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: zad_flutter/build/app/outputs/flutter-apk/app-*-release.apk

      # The Play Console bundle, signed with the upload key. Only this step sees
      # the key, so the APKs above keep the debug key the phone already has.
      - name: Build Play bundle (AAB)
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.ZAD_UPLOAD_KEYSTORE_B64 }}
          UPLOAD_PASSWORD: ${{ secrets.ZAD_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ] || [ -z "$UPLOAD_PASSWORD" ]; then
            echo "::warning title=Play bundle::ZAD_UPLOAD_KEYSTORE_B64 / ZAD_UPLOAD_KEY_PASSWORD not set — no AAB built."
            echo "⚠️ No Play bundle: set ZAD_UPLOAD_KEYSTORE_B64 and ZAD_UPLOAD_KEY_PASSWORD." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$UPLOAD_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/upload.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" KEY_ALIAS=releasekey \
                 STORE_PASSWORD="$UPLOAD_PASSWORD" KEY_PASSWORD="$UPLOAD_PASSWORD"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep -i fingerprint
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          rm -f "$KEYSTORE_PATH"
        working-directory: zad_flutter

      - uses: actions/upload-artifact@v4
        if: hashFiles('zad_flutter/build/app/outputs/bundle/release/app-release.aab') != ''
        with:
          name: app-release-aab
          path: zad_flutter/build/app/outputs/bundle/release/app-release.aab
