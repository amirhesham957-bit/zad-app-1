name: Edge Functions

# الإيدج فانكشنز مكانش عليها أي CI خالص — الـworkflow التاني كله كوتلن
# (`testDebugUnitTest` / `lintDebug` / `assembleDebug`). يعني الـ120 اختبار Deno كانوا
# بيشتغلوا لما حد يفتكر يشغّلهم محليًا بس، والنص التاني من التطبيق (العقل، الأدوات،
# الڤاليديتورز، مسح الحساب) كان بيتنشر على الإنتاج من غير أي بوابة.
#
# `deno check` بقى ينفع يبقى بوابة بعد ما اتنضفت ١٥ غلطة TS18046 قديمة كانت بتخلّيه
# راسب دايمًا — قبل كده مكانش ينفع يتحط هنا أصلاً لأنه كان هيفشل على كود شغّال.

# الفلتر ده كان على `supabase/functions/**` بس، ودي بقت غلطة أول ما الـ job بتاع النشر
# بقى بيدفع الـ migrations كمان: تعديل على `supabase/migrations/**` لوحده ماكانش بيشغّل
# الـ workflow أصلاً، يعني migration جديد ممكن يتدمج في main ويقعد مستني للأبد لحد ما حد
# يصادف إنه يعدّل فانكشن. `config.toml` مضافة لنفس السبب — هي اللي فيها verify_jwt
# وproject id، وتغييرها لازم يوصل الإنتاج.
#
# هذا السطر (تعديل هذا الملف) هو التشغيلة الأولى للـCI على seam1010x-lab/zad-app بعد
# تفعيل Actions وإضافة SUPABASE_ACCESS_TOKEN/SUPABASE_DB_PASSWORD هناك (٢٠٢٦-٠٩-١٣) —
# الريبو الصح، مش abek52278-ops اللي كان موثّق غلط قبل كده.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/edge-functions.yml"
  pull_request:
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/edge-functions.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # نفس الترتيب اللي بيتعمل محليًا: التحقق من الأنواع الأول، وبعدين الاختبارات.
      # فشل التحقق بيوقّف الشغل قبل ما الاختبارات تدّي رسالة أقل وضوحًا.
      # ── بوابة الأنواع: بتعدّ الفانكشنز بنفسها، مش قايمة مكتوبة بالإيد ─────────
      # القايمة اليدوية القديمة هي **السبب الجذري** مش العَرَض: كانت بتفحص ٦ فانكشنز
      # من ١٣، فـ amazon-creators-search و update-behavior-profile فضلوا بره البوابة،
      # ورسّبوا `deno check` بـTS18046 من غير ما حد يعرف، وفضلت النسخة المنشورة من
      # amazon-creators-search بتنده llama-3.3-70b-versatile (بيرجّع 404 من 2026-08-31)
      # لأن إصلاح الموديل الموجود في git ماكانش ليه طريق ينشر أصلاً.
      #
      # اللوب دي بتفحص كل ملف .ts في جذر كل فانكشن (ما عدا ملفات الاختبار، ليها خطوة
      # `deno test` تحت). فحص كل ملف لوحده مش بس index.ts مقصود: `deno check index.ts`
      # بيغطي اللي index بيستوردهم بس، فملف موجود ومش مستورد كان هيفضل غير مفحوص.
      - name: Type-check every edge function
        working-directory: supabase/functions
        run: |
          set -e
          failed=""
          for dir in */; do
            fn="${dir%/}"
            # أي مجلد ببادئة _ مش فانكشن — مكتبة مشتركة أو أدوات (_shared، _schema).
            case "$fn" in _*) continue ;; esac
            files=$(find "$fn" -maxdepth 1 -name '*.ts' ! -name '*_test.ts' | sort | tr '\n' ' ')
            [ -z "$files" ] && continue
            echo "::group::deno check $fn"
            if ! deno check $files; then failed="$failed $fn"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error title=Type-check failed::$failed"
            exit 1
          fi
          echo "All edge functions type-check."

      # الاختبارات بتفضل صريحة: مش كل فانكشن عندها اختبارات، و`deno test` على مجلد
      # من غير ملفات اختبار بيرجع نجاح فاضي — اللي بيخفي اختفاء ملف اختبار.
      - name: Test zad-brain
        working-directory: supabase/functions/zad-brain
        run: deno test --allow-all

      - name: Test zad-core-intelligence
        working-directory: supabase/functions/zad-core-intelligence
        run: deno test --allow-all

      - name: Test zad-telegram-bot
        working-directory: supabase/functions/zad-telegram-bot
        run: deno test --allow-all

      - name: Test zad-voice-live
        working-directory: supabase/functions/zad-voice-live
        run: deno test --allow-all

      - name: Test admob-ssv
        working-directory: supabase/functions/admob-ssv
        run: deno test --allow-all

      - name: Test zad-fx-refresh
        working-directory: supabase/functions/zad-fx-refresh
        run: deno test --allow-all

      - name: Test _shared
        working-directory: supabase/functions/_shared
        run: deno test --allow-all

      - name: Schema contract (.from/.select/.insert vs live schema)
        working-directory: supabase/functions/_schema
        run: deno test --allow-all

  # النشر من الريبو، بعد ما الفحص يعدي — مش من على جهاز حد.
  #
  # الانحراف بين الريبو والمنشور مش احتمال نظري هنا، هو حصل فعلاً: في 2026-08-01 النسخة
  # المنشورة v89 كانت فقدت أكشن nearby_pois وبرومبتات الفاتورة المتشددة وحواجز
  # "متقترحش إلغاء التزام ثابت" — وكلهم كانوا موجودين في git. وCLAUDE.md لسه بيقول
  # "قارن المنشور بالريبو قبل ما تفترض إن أي طرف هو المرجع"، وهي نصيحة صحيحة بس بتعالج
  # العرض. السبب إن النشر كان خطوة يدوية منفصلة عن الفحص.
  #
  # بيشتغل على main بس، ومربوط بنجاح check — كود مايعديش الأنواع أو التستات مابيوصلش
  # للإنتاج. الـ migrations بتتدفع في نفس الخطوة عشان السكيما والكود اللي بيعتمد عليها
  # ما يتفرقوش (زي zad_subscription_next_renewal اللي الفانكشن محتاجاها موجودة).
  deploy:
    needs: check
    # `workflow_dispatch` مسموح كمان، مش `push` بس. من غيره التشغيل اليدوي من تبويب
    # Actions بيعمل الفحص ويتخطى النشر بصمت — وهو بالظبط الزرار اللي حد هيدوس عليه لما
    # يعوز ينشر من غير ما يستنى تعديل جديد.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # الأسرار بتتفحص قبل أي حاجة. GitHub مابيسمحش بقراءة `secrets` في `if` على مستوى
      # الـ job، فالبوابة خطوة بتحوّلها لـ output والباقي بيتعلّق عليها.
      #
      # لو ناقصة، الـ job بيعدّي أخضر — بس مش بصمت: warning annotation فوق الرن، وسطر في
      # ملخص الرن. كنت مفضّل الفشل الصريح، والمالك قرر إن main تفضل خضرا؛ التنازل المقبول
      # إن التخطي يفضل **مرئي**، لأن نشر بيتخطى من غير ما حد ياخد باله هو بالظبط اللي
      # رجّع v89 تفترق عن git.
      - name: Check deploy secrets
        id: preflight
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # `if` صريحة مش `[ ... ] && ...`: الـ runner بيشغّل `bash -e`، والصيغة التانية
        # بترجع non-zero لما الشرط ما يتحققش فتوقّف الخطوة — يعني وجود السرّين كان
        # هيفشل الخطوة اللي وظيفتها تقول إنهم موجودين.
        run: |
          missing=""
          if [ -z "$ACCESS_TOKEN" ]; then missing="$missing SUPABASE_ACCESS_TOKEN"; fi
          if [ -z "$DB_PASSWORD" ]; then missing="$missing SUPABASE_DB_PASSWORD"; fi
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy skipped::Missing repository secret(s):$missing - migrations and edge functions were NOT deployed. The repo is now ahead of production."
            {
              echo "### :warning: Deploy skipped"
              echo ""
              echo "Missing repository secret(s): $missing"
              echo ""
              echo "The checks passed, but **nothing was deployed**. Add the secret(s) under"
              echo "Settings -> Secrets and variables -> Actions, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # نسخة مثبّتة، مش `latest`، لسببين. الأول إن `latest` بتخلّي الـ action يسأل GitHub
      # API عن آخر إصدار، والنداء ده بيتعمل من غير توكن فبيضرب في حد المعدل — وهو بالظبط
      # اللي فشل بيه أول نشر حقيقي: "Failed to resolve latest Supabase CLI release: rate
      # limit exceeded". والتاني إن `latest` معناها إن ترقية في الـ CLI تقدر تغيّر سلوك
      # النشر من غير ما حد يعدّل سطر هنا؛ ترقية النسخة تبقى commit مقصود.
      #
      # GITHUB_TOKEN متبعت كمان عشان أي نداء للـ API يبقى موثّق بدل ما يتحسب على حصة
      # الـ IP المشتركة بتاعة الرَنر.
      - name: Setup Supabase CLI
        if: steps.preflight.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: 2.114.0

      # الـ project ref مش سر — هو موجود في supabase/config.toml في الريبو أصلاً، وRLS هي
      # الحماية مش خفاء المعرّف. قراءته من الملف بدل سر إضافي معناها سر أقل ممكن ينسى
      # يتحط فيفشل النشر لسبب مالوش علاقة بالكود.
      # ملاحظة: وجود SUPABASE_DB_PASSWORD وحده لا يثبت إنه حديث؛ لو اتعمل reset لكلمة
      # مرور قاعدة البيانات لازم GitHub Secret يتحدث هو كمان، وإلا `db push` هيرجع
      # SQLSTATE 28P01 حتى مع access token سليم.
      - name: Read project ref
        if: steps.preflight.outputs.ready == 'true'
        run: echo "PROJECT_REF=$(grep -oP '(?<=^id = ")[^"]+' supabase/config.toml)" >> "$GITHUB_ENV"

      - name: Push migrations
        if: steps.preflight.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # Some reviewed migrations predate the current remote head because production
          # was previously changed through MCP. Their SQL is idempotent and smoke-tested;
          # --include-all lets the CLI reconcile them in version order.
          supabase db push --include-all

      - name: Deploy edge functions
        if: steps.preflight.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # نفس مبدأ خطوة الفحص: بنعدّ المجلدات مش بنكتب قايمة. القايمة اليدوية
          # القديمة كانت بتنشر ٩ من ١٣، فأربع فانكشنز (amazon-creators-search،
          # update-behavior-profile، affiliate-price-refresh، voice-selftest) عمرها
          # ما وصلت الإنتاج من CI — اتنين منهم آخر نشر ليهم كان بالإيد في يوليو.
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            # زي حلقة الفحص: _shared و_schema مكتبات، مش فانكشنز تتنشر.
            case "$fn" in _*) continue ;; esac
            echo "::group::deploy $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done

      # مفاتيح المزوّدين: «المفتاح اتحط؟ وشغال؟» مقاسة بعد كل نشر مش تخمين. أسماء الأسرار
      # بتتطبع (مش القيم — الـCLI بيطبع digest بس، وإحنا بناخد الاسم)، والفحص الحي بيرجّع حالة
      # HTTP لكل مزوّد (zad-core-intelligence provider_health). مفتاح service role بيتعمله mask
      # قبل أي استخدام. مابيفشّلش النشر — تشخيص بس.
      - name: Provider keys health (names + status only)
        if: steps.preflight.outputs.ready == 'true'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "### Supabase secret names" >> "$GITHUB_STEP_SUMMARY"
          supabase secrets list --project-ref "$PROJECT_REF" \
            | awk -F'|' 'NR>2 { gsub(/^[ \t]+|[ \t]+$/, "", $1); if ($1 != "") print "- " $1 }' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          SERVICE_KEY=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json \
            | jq -r '[.[] | select(.name == "service_role")][0].api_key // empty')
          if [ -z "$SERVICE_KEY" ]; then echo "no service_role key from CLI"; exit 0; fi
          echo "::add-mask::$SERVICE_KEY"
          sleep 20
          curl -sS --max-time 90 -X POST "https://$PROJECT_REF.supabase.co/functions/v1/zad-core-intelligence" \
            -H "Authorization: Bearer $SERVICE_KEY" -H "Content-Type: application/json" \
            -d '{"action":"provider_health"}' > provider_health.json || true
          echo "### Provider health" >> "$GITHUB_STEP_SUMMARY"
          { echo '```json'; jq . provider_health.json 2>/dev/null || cat provider_health.json; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
