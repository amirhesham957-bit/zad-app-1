# The Flutter template ships -Xmx8G -XX:MaxMetaspaceSize=4G here. Nothing this
# app builds needs it, and a container or CI runner with less than that does not
# fail with an out-of-memory message — the daemon is killed and Gradle reports
# "Gradle build daemon disappeared unexpectedly", which names no cause at all.
# Raise these deliberately if a real build ever needs it, not by reflex.
#
# Raised once, deliberately (2026-09-21): with Firebase messaging in the app,
# R8 and release lint died with "OutOfMemoryError: Metaspace" at 512m / 1600m.
# 1g of metaspace and 2.5g of heap build it; measured on a 15 GB Codespace.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1200m -XX:MaxMetaspaceSize=384m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
