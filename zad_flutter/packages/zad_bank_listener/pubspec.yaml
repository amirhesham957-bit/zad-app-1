name: zad_bank_listener
description: "Captures Android notifications that may carry bank messages, durably."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  plugin:
    platforms:
      # Android only, and that is not a gap. The channel this exists to read is
      # the Android notification shade; iOS has no equivalent a third-party app
      # may listen to.
      android:
        package: com.aistudio.zad.banklistener
        pluginClass: ZadBankListenerPlugin
