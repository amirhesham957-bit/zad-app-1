name: zad
description: "زاد — مساعد مالي ذكي للعائلة العربية."
publish_to: none
version: 1.0.0+1

environment:
  # The floor is set by riverpod_lint, freezed and very_good_analysis, all of
  # which require Dart 3.13. Verified against Flutter 3.47.5 / Dart 3.13.4.
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State: one manager, no second one.
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # ── Server
  supabase_flutter: ^2.17.2

  # ── Local cache (offline-first). hive_ce, not hive: the original hive 2.2.3
  # and hive_flutter 1.1.0 both declare `sdk: >=2.12.0 <3.0.0`, which excludes
  # Dart 3 outright. Same wall on isar 3.1.0+1.
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  path_provider: ^2.1.6

  # ── Navigation
  go_router: ^18.0.1

  # ── The Android notification channel the bank messages arrive on. Local
  # package: the service is this app's, not a general-purpose dependency.
  zad_bank_listener:
    path: packages/zad_bank_listener

  # ── Sync triggers. Reports which interface is up, not whether anything is
  # reachable, which is enough: a false "online" costs one transient failure.
  connectivity_plus: ^7.3.1

  # ── Motion and graphics
  flutter_animate: ^4.5.2
  rive: ^0.14.11
  flutter_shaders: ^0.1.3
  smooth_corner: ^1.1.1
  fl_chart: ^1.2.0
  flutter_svg: ^2.3.0

  # ── Icons, as a bundled font. Note this is deliberately NOT how the Kotlin
  # app does it: LucideIcon.kt fetches each glyph from a CDN, which means an
  # offline first launch draws no icons at all. `lucide_icons` (the other
  # package) is Dart 2 only — `sdk: >=2.12.0 <3.0.0`.
  lucide_icons_flutter: ^3.1.20

  # ── Camera and gallery, for the receipt scanner.
  #
  # image_picker, not the `camera` plugin: this app wants one still frame from
  # whatever camera app the phone already has, not a viewfinder it has to draw,
  # focus and rotate itself. Going through the system camera intent also means
  # no CAMERA permission in the manifest — the picker owns that — which matters
  # for a Play listing that has already dropped RECEIVE_SMS for the same kind
  # of reason.
  #
  # Its maxWidth/maxHeight/imageQuality do the resize and the JPEG encode, so
  # the 1024px/q70 the Kotlin client sends to the vision model is reproduced
  # without a second image package.
  image_picker: ^1.2.0

  # ── Audio
  record: ^7.1.1
  permission_handler: ^13.0.2

  # ── Time. The budget period is a civil range on the account's market
  # calendar, so the client needs the same IANA rules Postgres uses; Dart core
  # knows only UTC and the device's own zone.
  timezone: ^0.11.1

  # ── Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ── Misc
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  collection: ^1.19.1
  # Client-generated row ids. They are what makes an outbox retry idempotent:
  # the id travels with the queued write, so a replay collides on the primary
  # key instead of inserting a second row and firing the notification triggers
  # a second time.
  uuid: ^4.5.1
  # No envied. It exists to obfuscate compile-time secrets, and the only secret
  # the client holds is the Supabase anon key, which is designed to be public
  # and is guarded by RLS — obfuscating it buys nothing and costs a codegen
  # step. Config comes from --dart-define-from-file instead; see core/env.

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  # No custom_lint here, and it is not an oversight: custom_lint 0.8.1, the
  # newest there is, pins `analyzer: ^8.0.0`, while riverpod_generator and
  # freezed need >=13 and >=14. It is also no longer required — riverpod_lint
  # 3.x runs on the analyzer's own `analysis_server_plugin` instead.
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  hive_ce_generator: ^1.11.3
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  # The same variable font files the Kotlin app ships, copied from
  # app/src/main/res/font/ so text measures identically on both clients.
  # Bundled, never fetched: google_fonts would download on first run, which
  # contradicts both offline-first and instant-open.
  #
  # One file per family, with weight applied through the `wght` axis at use site
  # (see design/tokens/zad_typography.dart) rather than declared per weight here.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo_variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_variable.ttf
